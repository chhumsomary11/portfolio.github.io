<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"

    <link

      sizes="16x16"

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>Mary | Aspiring Software Developer, Phnom Penh</title>
    <script>
      // Apply the saved day/dusk choice before first paint (day by default).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
